name = "MeasuringAdvancedAILean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["UncontainabilityLean", "AlignmentUndecidability", "Submission"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

# The project's Lean files that the comment cites, copied unchanged.
[[lean_lib]]
name = "UncontainabilityLean"
globs = ["UncontainabilityLean", "UncontainabilityLean.+"]

# Three files vendored unchanged from mbrcic/ai-safety-formalization-atlas (Apache-2.0) at
# commit ecf4c4eda25963fc77bf6fe65f8e409b564ed0b4: the no-free-lunch characterization (CT-10).
[[lean_lib]]
name = "AISafetyAtlas"
srcDir = "Vendor"
roots = ["AISafetyAtlas.Learning", "AISafetyAtlas.Learning.Sharp", "AISafetyAtlas.Combinatorics.PermInvariance"]

# The worked example (738 tasks) and the axiom check for every cited theorem.
[[lean_lib]]
name = "Submission"
globs = ["Submission.+"]

# The formalization of Melo et al. 2025 (claims MTH-C1 and MTH-C3), copied unchanged with its
# licence from Vendor/MachinesThatHalt/ in the project's working repository (upstream:
# machines-that-halt-lean at commit 6aa93b4f5010b64d4377af97ca97994c319d46d2, Apache-2.0).
[[lean_lib]]
name = "AlignmentUndecidability"
srcDir = "Vendor/MachinesThatHalt"
roots = ["AlignmentUndecidability"]
